name: Build and validate portable SNMP tool
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and test against local simulated SNMP agents
        shell: powershell
        run: ./build.ps1 -Test
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install independent Net-SNMP agent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y snmpd
      - name: Check v3 interoperability on loopback only
        run: bash tests/interop/run.sh
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, interop]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build portable release and Windows previews
        shell: powershell
        run: |
          ./build.ps1 -Test
          Compress-Archive -Path dist/* -DestinationPath snmptoolRAV-portable.zip
      - name: Prepare reviewable draft with portable downloads
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets=@('snmptoolRAV-portable.zip','dist/snmptoolRAV.exe','dist/SHA256SUMS.txt')+@(Get-ChildItem dist/ui-previews/*.png | ForEach-Object FullName)
          $releases=gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          $existing=$releases | Where-Object tagName -eq $env:GITHUB_REF_NAME | Select-Object -First 1
          if ($null -ne $existing) {
            if (!$existing.isDraft) { throw 'Refusing to overwrite a published release.' }
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset update failed.' }
            gh release edit $env:GITHUB_REF_NAME --title "snmptoolRAV $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $env:GITHUB_REF_NAME --draft @assets --title "snmptoolRAV $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
